<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#080c16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.85" />
    </linearGradient>

    <!-- Area Chart Gradient -->
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Forecast Area Gradient -->
    <linearGradient id="forecast-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-opacity="0.25" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="675" />
    <line x1="220" y1="0" x2="220" y2="675" />
    <line x1="380" y1="0" x2="380" y2="675" />
    <line x1="540" y1="0" x2="540" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="860" y1="0" x2="860" y2="675" />
    <line x1="1020" y1="0" x2="1020" y2="675" />

    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Top Navigation Header -->
  <rect x="30" y="20" width="1140" height="60" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  
  <!-- Logo & Title -->
  <g transform="translate(50, 36)">
    <!-- Chart Growth Icon -->
    <rect width="30" height="30" rx="7" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M7 21L13 14L17 17L23 8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M19 8H23V12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="42" y="16" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.5">MarketIQ</text>
    <text x="42" y="27" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1.2">REAL-TIME SALES &amp; AI FORECASTING ENGINE</text>
  </g>

  <!-- Status Indicator Pill -->
  <g transform="translate(620, 34)">
    <rect width="280" height="32" rx="16" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#glow-filter)" />
    <text x="28" y="20" fill="#a7f3d0" font-size="11" font-weight="700">SQL ENGINE: ACTIVE | PROPHET AI: ONLINE</text>
  </g>

  <!-- Author Badge -->
  <g transform="translate(930, 34)">
    <rect width="220" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <text x="16" y="20" fill="#c7d2fe" font-size="11" font-weight="700">ARCHITECT: UMAR MUKTHAR</text>
  </g>

  <!-- ==================== 4 TOP KPI METRIC CARDS ==================== -->
  <g transform="translate(30, 95)">
    <!-- KPI 1: Gross Revenue -->
    <g transform="translate(0, 0)">
      <rect width="268" height="90" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">TOTAL GROSS REVENUE</text>
      <text x="18" y="58" fill="#f8fafc" font-size="24" font-weight="900" font-family="'JetBrains Mono', monospace">$6,927,447</text>
      <text x="18" y="78" fill="#10b981" font-size="11" font-weight="700">&#8593; +14.8% YoY growth</text>
    </g>

    <!-- KPI 2: Total Orders -->
    <g transform="translate(290, 0)">
      <rect width="268" height="90" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">TOTAL FULFILLED ORDERS</text>
      <text x="18" y="58" fill="#38bdf8" font-size="24" font-weight="900" font-family="'JetBrains Mono', monospace">12,000</text>
      <text x="18" y="78" fill="#38bdf8" font-size="11" font-weight="700">Avg. 352 orders/month</text>
    </g>

    <!-- KPI 3: Average Order Value (AOV) -->
    <g transform="translate(580, 0)">
      <rect width="268" height="90" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">AVERAGE ORDER VALUE (AOV)</text>
      <text x="18" y="58" fill="#a78bfa" font-size="24" font-weight="900" font-family="'JetBrains Mono', monospace">$577.29</text>
      <text x="18" y="78" fill="#a78bfa" font-size="11" font-weight="700">8,597 unique customers</text>
    </g>

    <!-- KPI 4: Prophet Q4 Forecast -->
    <g transform="translate(870, 0)">
      <rect width="270" height="90" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="28" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="0.5">&#10024; PROPHET AI FORECAST (Q4)</text>
      <text x="18" y="58" fill="#fbbf24" font-size="24" font-weight="900" font-family="'JetBrains Mono', monospace">$684,200</text>
      <text x="18" y="78" fill="#f59e0b" font-size="11" font-weight="700">95% Confidence Interval</text>
    </g>
  </g>

  <!-- ==================== MAIN CHART: MONTHLY REVENUE & PROPHET FORECAST ==================== -->
  <g transform="translate(30, 205)">
    <rect width="1140" height="260" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
    
    <!-- Title & Legend -->
