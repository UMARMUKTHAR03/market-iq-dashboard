      80,200
      80,140 120,128 160,110 200,125 240,126 280,165 320,154 360,138 400,118 440,132 480,120 520,112
      560,105 600,118 640,98 680,115 720,110 760,145 800,138 840,122 880,108 920,115 920,200
    " fill="url(#area-grad)" />

    <!-- Historical Solid Line -->
