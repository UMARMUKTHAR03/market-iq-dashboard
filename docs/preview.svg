      <line x1="60" y1="80" x2="1080" y2="80" />
      <line x1="60" y1="120" x2="1080" y2="120" />
      <line x1="60" y1="160" x2="1080" y2="160" />
      <line x1="60" y1="200" x2="1080" y2="200" />
    </g>

    <!-- Y-axis labels -->
