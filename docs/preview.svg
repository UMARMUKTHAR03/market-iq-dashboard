      80,140 120,128 160,110 200,125 240,126 280,165 320,154 360,138 400,118 440,132 480,120 520,112
      560,105 600,118 640,98 680,115 720,110 760,145 800,138 840,122 880,108 920,115
    " fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Historical Data Points -->
    <circle cx="80" cy="140" r="3.5" fill="#10b981" />
    <circle cx="160" cy="110" r="3.5" fill="#10b981" />
    <circle cx="280" cy="165" r="3.5" fill="#10b981" />
    <circle cx="400" cy="118" r="3.5" fill="#10b981" />
    <circle cx="640" cy="98" r="4.5" fill="#10b981" stroke="#f8fafc" stroke-width="1.5" />
    <circle cx="840" cy="122" r="3.5" fill="#10b981" />
    <circle cx="920" cy="115" r="4.5" fill="#10b981" stroke="#f8fafc" stroke-width="1.5" />

    <!-- Forecast Confidence Envelope -->
    <polygon points="
      920,115 960,95 1000,88 1040,80 1080,75
      1080,145 1040,140 1000,135 960,130 920,115
    " fill="url(#forecast-grad)" />

    <!-- Forecast Dotted Prediction Line -->
    <polyline points="
      920,115 960,110 1000,104 1040,96 1080,90
    " fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="1080" cy="90" r="4.5" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5" filter="url(#glow-filter)" />

    <!-- Forecast Callout Box -->
    <g transform="translate(940, 60)">
      <rect width="130" height="24" rx="5" fill="#0369a1" fill-opacity="0.9" />
      <text x="65" y="16" fill="#f0f9ff" font-size="10" font-weight="700" text-anchor="middle">2026-Q1: $248k Projected</text>
    </g>

    <!-- X-axis timeline markers -->
    <g fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">
      <text x="80" y="222" text-anchor="middle">2023-01</text>
      <text x="240" y="222" text-anchor="middle">2023-07</text>
      <text x="400" y="222" text-anchor="middle">2024-01</text>
      <text x="560" y="222" text-anchor="middle">2024-07</text>
      <text x="720" y="222" text-anchor="middle">2025-01</text>
      <text x="880" y="222" text-anchor="middle">2025-07</text>
      <text x="920" y="222" text-anchor="middle" fill="#10b981">2025-10</text>
      <text x="1040" y="222" text-anchor="middle" fill="#38bdf8">2026-03 (FC)</text>
    </g>
  </g>

