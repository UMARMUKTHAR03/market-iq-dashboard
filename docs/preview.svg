  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(30, 640)">
    <text x="0" y="15" fill="#64748b" font-size="12" font-weight="500">MarketIQ • Streamlit + Plotly + SQLAlchemy + Facebook Prophet • Real-Time Sales &amp; Business Intelligence</text>
    <text x="1140" y="15" fill="#818cf8" font-size="12" font-weight="700" text-anchor="end">Engineered &amp; Maintained by UMAR MUKTHAR • MIT License 2026</text>
  </g>
</svg>