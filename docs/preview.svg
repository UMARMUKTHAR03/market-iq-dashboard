    <!-- Column 1: Omnichannel Distribution -->
    <g transform="translate(0, 0)">
      <rect width="555" height="135" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="26" fill="#f8fafc" font-size="13" font-weight="700">Omnichannel Sales Contribution</text>
      
      <!-- Progress Bar 1: Marketplace -->
      <g transform="translate(20, 36)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11">Marketplace ($1.78M • 25.7%)</text>
        <rect x="0" y="16" width="515" height="6" rx="3" fill="#1e293b" />
        <rect x="0" y="16" width="132" height="6" rx="3" fill="#10b981" />
      </g>

      <!-- Progress Bar 2: Retail -->
      <g transform="translate(20, 68)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11">Retail Stores ($1.74M • 25.1%)</text>
        <rect x="0" y="16" width="515" height="6" rx="3" fill="#1e293b" />
        <rect x="0" y="16" width="129" height="6" rx="3" fill="#06b6d4" />
      </g>

      <!-- Progress Bar 3: Mobile App & Web -->
      <g transform="translate(20, 100)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11">Mobile App &amp; Web ($3.41M • 49.2%)</text>
        <rect x="0" y="16" width="515" height="6" rx="3" fill="#1e293b" />
        <rect x="0" y="16" width="254" height="6" rx="3" fill="#8b5cf6" />
      </g>
    </g>

    <!-- Column 2: Top Product Categories -->
    <g transform="translate(585, 0)">
      <rect width="555" height="135" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="26" fill="#f8fafc" font-size="13" font-weight="700">Top Revenue Product Verticals</text>
      
      <g transform="translate(20, 36)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11">Electronics (Phones, Audio, Laptops)</text>
        <text x="515" y="12" fill="#10b981" font-size="11" font-weight="700" text-anchor="end">$2,410,500</text>
        <rect x="0" y="16" width="515" height="6" rx="3" fill="#1e293b" />
        <rect x="0" y="16" width="450" height="6" rx="3" fill="#10b981" />
      </g>

      <g transform="translate(20, 68)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11">Fashion (Women, Men, Accessories)</text>
        <text x="515" y="12" fill="#06b6d4" font-size="11" font-weight="700" text-anchor="end">$2,378,200</text>
        <rect x="0" y="16" width="515" height="6" rx="3" fill="#1e293b" />
        <rect x="0" y="16" width="442" height="6" rx="3" fill="#06b6d4" />
      </g>

      <g transform="translate(20, 100)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11">Home &amp; Decor (Furniture, Kitchen)</text>
        <text x="515" y="12" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="end">$2,138,700</text>
        <rect x="0" y="16" width="515" height="6" rx="3" fill="#1e293b" />
        <rect x="0" y="16" width="398" height="6" rx="3" fill="#f59e0b" />
