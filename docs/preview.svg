    <text x="45" y="124" fill="#64748b" font-size="9" text-anchor="end" font-family="'JetBrains Mono', monospace">$200k</text>
    <text x="45" y="164" fill="#64748b" font-size="9" text-anchor="end" font-family="'JetBrains Mono', monospace">$150k</text>
